name: Desktop build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      BILIOSHI_APP_DATA: ${{ github.workspace }}/build/desktop-ci-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-desktop.txt
      - run: python tools/offline_test.py
      - run: python tools/desktop_smoke.py
      - run: ./build_desktop.ps1 -Mode onefile
      - name: Frozen diagnostics
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './dist/onefile/BiliOshi.exe' -ArgumentList '--diagnostic' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Frozen diagnostic failed' }
          $value = Get-Content "$env:BILIOSHI_APP_DATA/diagnostic.json" -Raw | ConvertFrom-Json
          if (-not $value.ok -or -not $value.frozen) { throw 'Invalid diagnostic result' }
      - name: Add release documents
        shell: pwsh
        run: |
          Copy-Item -LiteralPath README.md,Install-Desktop.ps1,LICENSE,THIRD_PARTY_LICENSES.md -Destination dist/onefile
      - uses: actions/upload-artifact@v7
        with:
          name: BiliOshi-Windows
          path: dist/onefile/
